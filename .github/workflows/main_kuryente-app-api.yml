# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - kuryenteapp1

on:
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  PYTHON_VERSION: '3.12' # set this to the python version to use (supports 3.6, 3.7, 3.8)


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip artifact for deployment
        working-directory: ./backend-1
        run: zip release.zip . -r -x "*.git*" "*__pycache__*" "*__azurite*" "*__blobstorage__*" "*.venv*" "*.python_packages*" "*local.settings.json*" "*release.zip*" # Zips everything except git history, local dev artifacts, and the virtualenv

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend-1/release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          rm release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F9F3B3184A0E4B7BB312BD5FC59CB16C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0364802175624F28B10C85B70FA73A44 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_57C3BA435FD64554AFB904E84B89EEE6 }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'kuryenteapp1'
          slot-name: 'Production'
          remote-build: true
          scm-do-build-during-deployment: true
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
